# Dodaje oznake frontend, backend, docs i infra prema mapama koje PR mijenja (pravila: .github/labeler.yml).
name: Labels

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label by changed paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
