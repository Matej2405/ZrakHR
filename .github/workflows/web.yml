# Provjera web dashboarda: format, testovi te build, koji uključuje provjeru tipova i lint.
name: Web

on:
  pull_request:
    paths:
      - web/**
      - .github/workflows/web.yml
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/web.yml

permissions:
  contents: read

# Novi push na istu granu prekida provjeru prethodnog
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
